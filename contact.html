<!DOCTYPE html>
<html lang="en">
<!-- Document Head: Contains the page metadata, character encoding, viewport settings, and page title. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header: Introduces the Contact page with its main heading. -->
<header>
    <h1>Contact Me</h1>
</header>
<!-- Navigation: Provides links to the Home, About, and Contact pages. -->
<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>
<!-- Main Content: Contains the contact section and message form. -->

<main>
    <!-- Contact Section: Provides a form for visitors to send their name, email, and message. -->
    <section>
    <h2>Send Me a Message</h2>
    <!-- Contact Form: Collects the visitor's name, email address, and message. -->
    <form>
        <fieldset>
    <legend>Your Contact Details</legend>
        <label for="name">Name:</label>
        
<input type="text" id="name" name="name" placeholder="Enter your full name" minlength="2" maxlength="50" required>

        <label for="email">Email:</label>
       
<input type="email" id="email" name="email" placeholder="Enter your email address" maxlength="100" required>
<small id="email-help">Please enter a valid email address.</small>

        <label for="message">Message:</label>
        
<textarea id="message" name="message" placeholder="Write your message here..." minlength="10" maxlength="500" required></textarea>

<label for="preferred-date">Preferred Contact Date:</label>
<input type="date" id="preferred-date" name="preferred-date">

<p>How should we contact you?</p>

<label for="contact-email">
    <input type="radio" id="contact-email" name="contact-method" value="email">
    Email
</label>

<label for="contact-phone">
    <input type="radio" id="contact-phone" name="contact-method" value="phone">
    Phone
</label>

<label for="updates">
    <input type="checkbox" id="updates" name="updates" value="yes">
    I'd like to receive updates.
</label>

        <button type="submit">Send Message</button>
        </fieldset>
    </form>
</section>

</main>

<!-- Footer: Displays the copyright information for the website. -->
<footer>
    <p>&copy; 2026 My Favorite Games</p>
</footer>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- Document Head: Contains the page metadata, character encoding, viewport settings, and page title. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>

<body>
    <!-- Header: Introduces the Contact page with its main heading. -->
<header>
    <h1>Contact Me</h1>
</header>
<!-- Navigation: Provides links to the Home, About, and Contact pages. -->
<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>
<!-- Main Content: Contains the contact section and message form. -->

<main>
    <!-- Contact Section: Provides a form for visitors to send their name, email, and message. -->
    <section>
    <h2>Send Me a Message</h2>
    <!-- Contact Form: Collects the visitor's name, email address, and message. -->
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Message</button>
    </form>
</section>

</main>

<!-- Footer: Displays the copyright information for the website. -->
<footer>
    <p>&copy; 2026 My Favorite Games</p>
</footer>
</body>
</html>

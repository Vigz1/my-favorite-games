
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        
.games-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}
        

        .game-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>My Game Collection</h1>

    <div class="games-container">
        <div class="game-card">Grand Theft Auto IV</div>
        <div class="game-card">Mortal Kombat X</div>
        <div class="game-card">Just Cause 3</div>
        <div class="game-card">Infamous Second Son</div>
        <div class="game-card">Naruto Storm 4</div>
        <div class="game-card">Spider-Man</div>
    </div>

</body>
</html>
